<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>服务器错误 - 数学试卷批改系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            text-align: center;
            background: white;
            border-radius: 20px;
            padding: 60px 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 500px;
        }

        .error-code {
            font-size: 8em;
            font-weight: bold;
            color: #dc3545;
            margin-bottom: 20px;
        }

        .error-title {
            font-size: 2em;
            color: #333;
            margin-bottom: 15px;
        }

        .error-message {
            color: #666;
            font-size: 1.1em;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .home-btn {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 1.1em;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
            margin: 0 10px;
        }

        .home-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(79, 172, 254, 0.3);
        }

        .retry-btn {
            background: #6c757d;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 1.1em;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
            margin: 0 10px;
        }

        .retry-btn:hover {
            background: #5a6268;
        }

        .illustration {
            font-size: 6em;
            margin-bottom: 20px;
            opacity: 0.8;
        }

        .button-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="illustration">⚠️</div>
        <div class="error-code">500</div>
        <h1 class="error-title">服务器错误</h1>
        <p class="error-message">抱歉，服务器遇到了内部错误。<br>请稍后再试，或联系系统管理员。</p>
        <div class="button-group">
            <a href="/" class="home-btn">🏠 返回首页</a>
            <button class="retry-btn" onclick="window.location.reload()">🔄 重试</button>
        </div>
    </div>
</body>
</html>
